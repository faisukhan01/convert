<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="RidgeLine Convert — AI-Powered Lead Conversion Engine">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#121b31">
        <animate attributeName="stop-color" values="#121b31;#18244a;#121b31" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde68a">
        <animate attributeName="stop-color" values="#fde68a;#fff7d6;#fde68a" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00add8"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="orbBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#22304f" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="960" height="330" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- backdrop -->
    <rect width="960" height="330" fill="url(#bgGrad)"/>
    <rect width="960" height="330" fill="url(#grid)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- floating orbs -->
    <circle cx="140" cy="90" r="52" fill="#f59e0b" opacity="0.16" filter="url(#orbBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 26 -18; 0 0" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.16;0.30;0.16" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="240" r="60" fill="#00add8" opacity="0.16" filter="url(#orbBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -30 16; 0 0" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.16;0.28;0.16" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="70" r="40" fill="#a855f7" opacity="0.14" filter="url(#orbBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 20; 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="260" r="46" fill="#16a34a" opacity="0.12" filter="url(#orbBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 20 -14; 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- corner accents -->
    <path d="M 30 30 L 74 30 M 30 30 L 30 74" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.9"/>
    <path d="M 930 300 L 886 300 M 930 300 L 930 256" stroke="#00add8" stroke-width="3" fill="none" opacity="0.9"/>

    <!-- kicker -->
    <text x="480" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="600" fill="#fbbf24" letter-spacing="12">
      RIDGELINE
      <animate attributeName="opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- 3D extruded title -->
    <g>
      <text x="480" y="177" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
            font-size="92" font-weight="800" fill="#04070f" letter-spacing="6">CONVERT</text>
      <text x="480" y="171" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
            font-size="92" font-weight="800" fill="#0c1424" letter-spacing="6">CONVERT</text>
      <text x="480" y="165" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
            font-size="92" font-weight="800" fill="#18243a" letter-spacing="6">CONVERT</text>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="5s" repeatCount="indefinite"/>
        <text x="480" y="159" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
              font-size="92" font-weight="800" fill="url(#titleGrad)" letter-spacing="6" filter="url(#glow)">CONVERT</text>
      </g>
    </g>

    <!-- shine sweep -->
    <rect x="-220" y="20" width="130" height="290" fill="#ffffff" opacity="0.06" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1350 0" dur="7s" repeatCount="indefinite" additive="sum"/>
    </rect>

    <!-- subtitle -->
    <text x="480" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="21" font-weight="500" fill="#cbd5e1" letter-spacing="1.5">AI-Powered Lead Conversion Engine</text>

    <!-- stack chips -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">
      <rect x="128" y="244" width="160" height="34" rx="17" fill="#16a34a" fill-opacity="0.14" stroke="url(#greenGrad)" stroke-width="1.5"/>
      <text x="208" y="266" text-anchor="middle" fill="#86efac">GHL NATIVE</text>

      <rect x="304" y="244" width="150" height="34" rx="17" fill="#00add8" fill-opacity="0.14" stroke="url(#cyanGrad)" stroke-width="1.5"/>
      <text x="379" y="266" text-anchor="middle" fill="#67e8f9">GO STACK</text>

      <rect x="470" y="244" width="150" height="34" rx="17" fill="#a855f7" fill-opacity="0.14" stroke="url(#purpleGrad)" stroke-width="1.5"/>
      <text x="545" y="266" text-anchor="middle" fill="#e9d5ff">Z.AI BRAIN</text>

      <rect x="636" y="244" width="170" height="34" rx="17" fill="#475569" fill-opacity="0.18" stroke="url(#slateGrad)" stroke-width="1.5"/>
      <text x="721" y="266" text-anchor="middle" fill="#e2e8f0">NEXT.JS 16</text>
    </g>

    <!-- animated underline -->
    <rect x="174" y="302" height="3" rx="1.5" fill="url(#goldLine)">
      <animate attributeName="width" values="0;612" dur="2s" fill="freeze"/>
    </rect>
  </g>
</svg>
