name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ridgeline
          POSTGRES_PASSWORD: ridgeline
          POSTGRES_DB: ridgeline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ridgeline"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # CI validates the PostgreSQL path (the shipped production configuration).
      DATABASE_URL: postgresql://ridgeline:ridgeline@localhost:5432/ridgeline
      SESSION_SECRET: ci-secret
      TOKEN_ENCRYPTION_KEY: ci-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Flip schema to PostgreSQL (production provider)
        run: bun run db:use-postgres
      - name: Apply schema to PostgreSQL
        run: bun run db:push
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
